    <div class="body_wrapper">

    <form onsubmit="addItem(); return false;">
    <input type="text" id="itemInput" placeholder="Enter a new item">
    <button type="submit">Add to list</button>
  </form>

  <!-- Where items will appear -->
  <ul id="itemList"></ul>

  <script>
    // Called when the form is submitted
    function addItem() {
      const item_text = document.getElementById("itemInput").value.trim();

      // Check if input is empty
      if (item_text === "") {
        alert("Please enter an item before adding it!");
        return;
      }

      // Add the item
      RenderItem(item_text);

      // Clear input after adding
      document.getElementById("itemInput").value = "";
    }

    // Adds the new item to the list on the page
    function RenderItem(item_text) {
      const li = document.createElement("li");
      li.textContent = item_text;
      document.getElementById("itemList").appendChild(li);
    }
  </script>
